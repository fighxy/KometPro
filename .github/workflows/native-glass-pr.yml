name: Native Glass PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/native_glass_test.dart'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/native-glass-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-glass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test tool native/komet_crypto/lib
      - run: flutter test test/native_glass_test.dart

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Check Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: flutter pub get --enforce-lockfile
      - name: Compile unsigned iOS app
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign
