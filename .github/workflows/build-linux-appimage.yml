name: Build Linux AppImage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/setup-rust/**'
      - '.github/scripts/package-appimage.sh'
      - '.github/workflows/build-linux-appimage.yml'
      - 'assets/komet_icon.png'
      - 'lib/**'
      - 'linux/**'
      - 'native/**'
      - 'packaging/linux/**'
      - 'pubspec.lock'
      - 'pubspec.yaml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.3'

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev mpv libopus-dev libogg-dev libayatana-appindicator3-dev
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release
      - name: Verify native dependencies
        run: |
          if ldd build/linux/x64/release/bundle/Komet | grep -F 'not found'; then
            exit 1
          fi
      - name: Package AppImage
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          VERSION="$VERSION" bash .github/scripts/package-appimage.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/Komet-linux-x86_64.AppImage
            dist/Komet-linux-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 7
