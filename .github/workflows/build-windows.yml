# Komet 0.6 Windows (ux/native-pass)
# P0: single-instance, tray restore, titlebar theme, hide-on-close, taskbar flash
# P1: icon rail, density tokens, third column, compact menus, Alt+arrows
# P2: toast Reply/Read, jump list, Esc cascade, Ctrl+Shift+C/F
# P3: interface scale 75–150%, mica, autostart, tray badge, no circular reveal
# Not in this build: Inno/MSIX installer
name: Build Windows
run-name: Komet 0.6 Windows — native-pass P0–P3 (rail, scale, toasts, mica)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-windows.yml'

env:
  FLUTTER_VERSION: '3.44.3'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Komet-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: komet-windows-x64
          path: dist/Komet-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
